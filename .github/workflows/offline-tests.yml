name: Offline code regression
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (network allowed only for installation)
        run: python -m pip install -r tests/offline/requirements.txt
      - name: Baseline regression
        run: python -B tests/offline/run.py --full --report-dir tests/results/ci-baseline
      - name: Integration regression
        run: python -B tests/offline/run.py --integration --report-dir tests/results/ci-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-reports
          path: tests/results/ci-*
